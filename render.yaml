services:
  - type: web
    name: azi-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn azi_server.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: GOOGLE_API_KEY
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        sync: false

databases:
  - name: azi-db
    databaseName: azi_system
    user: azi_user
    plan: free
